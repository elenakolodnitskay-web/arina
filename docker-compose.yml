services:
  postgres:
    # pgvector/pgvector:pg16 — тот же Postgres 16, что и раньше (postgres:16-alpine),
    # плюс расширение vector для семантической памяти (Фаза 27). Смена образа не
    # ломает существующие данные — тот же мажорный формат, том сохраняется.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: arina
      POSTGRES_PASSWORD: arina
      POSTGRES_DB: arina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arina"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
