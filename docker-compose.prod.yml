services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arina
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arina"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Порт наружу не пробрасывается — только внутри docker-сети, доступ у сервиса bot.

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
